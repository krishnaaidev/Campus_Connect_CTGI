<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1747dc" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CampusConnect" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <title>CampusConnect — Smart Student Portal</title>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-brand-500 selection:text-white">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0b1120; color: #ffffff; font-family: Inter, system-ui, -apple-system, sans-serif; padding: 20px; text-align: center;">
        <div style="width: 56px; height: 56px; border-radius: 16px; background-color: #1747dc; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(23, 71, 220, 0.4); margin-bottom: 16px;">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
            <path d="M6 12v5c3 3 9 3 12 0v-5"/>
          </svg>
        </div>
        <h1 style="font-size: 20px; font-weight: 800; margin: 0 0 4px 0; letter-spacing: -0.5px;">CampusConnect</h1>
        <p style="font-size: 12px; color: #94a3b8; margin: 0 0 16px 0;">CT Group of Institutions — Loading Smart Portal...</p>
        <div style="width: 140px; height: 4px; background-color: #1e293b; border-radius: 99px; overflow: hidden; position: relative;">
          <div style="width: 40%; height: 100%; background-color: #3b82f6; border-radius: 99px; animation: progress 1.2s infinite ease-in-out;"></div>
        </div>
        <style>
          @keyframes progress {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(350%); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
